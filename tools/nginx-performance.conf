# nginx performance rules for groods.in (reference copy; apply on the server).
# Why: by default nginx only gzips text/html, so site.css, site.js and the SVG
# logo are sent uncompressed, and nothing is cached by the browser. PageSpeed
# reports this as "Enable text compression" and "Serve static assets with an
# efficient cache policy".
#
# Apply: put the gzip lines in the http { } block (or the server block), put the
# location blocks inside `server { server_name groods.in; ... }`, then
#   sudo nginx -t && sudo systemctl reload nginx
# Verify:
#   curl -sI -H "Accept-Encoding: gzip" https://groods.in/assets/site.css | grep -i "encoding\|cache"

gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

# CSS/JS are versioned with ?v=N in the HTML, so they can be cached for a year.
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Images and favicon: 30 days.
location ~* \.(webp|svg|png|jpg|jpeg|ico)$ {
    add_header Cache-Control "public, max-age=2592000";
}

# HTML: always revalidate so edits go live immediately (ETag keeps it cheap).
location ~* \.html$ {
    add_header Cache-Control "no-cache";
}
