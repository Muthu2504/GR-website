# nginx redirect rules for groods.in (reference copy; apply on the server).
# Fixes Search Console reports: www duplicate / "Google chose different canonical",
# 404 on /home/ and /login, 404 on /favicon.ico.
#
# Apply: merge into your nginx site config, then
#   sudo nginx -t && sudo systemctl reload nginx
# Verify:
#   curl -sI https://www.groods.in/ | head -3     -> 301, location: https://groods.in/
#   curl -sI https://groods.in/home/ | head -3    -> 301, location: https://groods.in/
#   curl -sI https://groods.in/favicon.ico | head -3

# 1) www -> apex (keep your existing ssl_certificate / ssl_certificate_key lines)
server {
    listen 80;
    listen 443 ssl;
    server_name www.groods.in;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    return 301 https://groods.in$request_uri;
}

# 2) Inside the existing `server { server_name groods.in; ... }` block:
#    old URLs from a previous version of the site, and the default favicon request.
#    (/login is optional: only add it if you want it to land on the homepage
#    instead of returning 404.)
#
#    location = /home/ { return 301 /; }
#    location = /home  { return 301 /; }
#    location = /login { return 301 /; }
#    location = /favicon.ico { return 301 /favicon.svg; }
